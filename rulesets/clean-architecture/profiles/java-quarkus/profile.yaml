profileId: "java-quarkus"
ruleSetId: "clean-architecture"
schemaVersion: "ruleset-profile-v2"
status: "published"
displayName: "Java Quarkus Verification Profile for Clean Architecture"
description: "Quarkus-specific verification profile for Clean Architecture rules with CDI, JAX-RS, and Panache-aware templates."
extendsProfile: "java"
appliesTo:
  languages: ["java"]
  frameworks: ["quarkus"]
  architectureStyles: ["clean-architecture", "hexagonal"]
  runtimes: ["jvm"]
toolchain:
  required:
    - type: "archunit"
      version: ">=1.3.0"
    - type: "junit"
      version: ">=5.10.0"
ruleMappings:
  - ruleId: "AR-101"
    verificationTemplates:
      - templateId: "VT-AR-101-ARCHUNIT-QUARKUS-002"
        coverage: "partial"
        parameterBindings:
          basePackage: "{{project.basePackage}}"
          basePackagePath: "{{project.basePackagePath}}"
          businessCorePackagePatterns: "{{project.packagePatterns.businessCoreCsv}}"
          forbiddenFrameworkDependencyPatterns: "{{project.quarkus.forbiddenFrameworkDependencyPatternsCsv}}"
  - ruleId: "AR-102"
    verificationTemplates:
      - templateId: "VT-AR-102-ARCHUNIT-QUARKUS-002"
        coverage: "partial"
        parameterBindings:
          basePackage: "{{project.basePackage}}"
          basePackagePath: "{{project.basePackagePath}}"
          domainPackagePatterns: "{{project.packagePatterns.domainCsv}}"
          applicationPackagePatterns: "{{project.packagePatterns.applicationCsv}}"
          outerLayerPackagePatterns: "{{project.packagePatterns.outerLayerCsv}}"
          technicalBoundaryPackagePatterns: "{{project.packagePatterns.technicalBoundaryCsv}}"
  - ruleId: "AR-104"
    verificationTemplates:
      - templateId: "VT-AR-104-ARCHUNIT-QUARKUS-002"
        coverage: "partial"
        parameterBindings:
          basePackage: "{{project.basePackage}}"
          basePackagePath: "{{project.basePackagePath}}"
          innerLayerPackagePatterns: "{{project.packagePatterns.innerLayerCsv}}"
          adapterAndPanachePackagePatterns: "{{project.packagePatterns.adapterAndPanacheCsv}}"
          outboundAdapterImplementationPackagePatterns: "{{project.packagePatterns.outboundAdapterImplementationCsv}}"
          portPackagePatterns: "{{project.packagePatterns.portCsv}}"
  - ruleId: "AR-105"
    verificationTemplates:
      - templateId: "VT-AR-105-ARCHUNIT-QUARKUS-002"
        coverage: "partial"
        parameterBindings:
          basePackage: "{{project.basePackage}}"
          basePackagePath: "{{project.basePackagePath}}"
          interfaceAdapterPackagePatterns: "{{project.packagePatterns.interfaceAdapterCsv}}"
          domainAndPersistencePackagePatterns: "{{project.packagePatterns.domainAndPersistenceCsv}}"
  - ruleId: "AR-106"
    verificationTemplates:
      - templateId: "VT-AR-106-ARCHUNIT-QUARKUS-002"
        coverage: "heuristic"
        parameterBindings:
          basePackage: "{{project.basePackage}}"
          basePackagePath: "{{project.basePackagePath}}"
          businessCorePackagePatterns: "{{project.packagePatterns.businessCoreCsv}}"
          forbiddenCrossCuttingDependencyPatterns: "{{project.quarkus.forbiddenCrossCuttingDependencyPatternsCsv}}"
