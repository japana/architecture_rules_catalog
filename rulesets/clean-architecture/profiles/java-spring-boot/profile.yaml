profileId: "java-spring-boot"
ruleSetId: "clean-architecture"
schemaVersion: "ruleset-profile-v1"
status: "draft"
displayName: "Java Spring Boot Profile for Clean Architecture"
description: "Spring Boot-specific interpretation hints for the clean-architecture ruleset."
extendsProfile: "java"
technology:
  language: "java"
  framework: "spring-boot"
  runtime: "jvm"
mappings:
  - ruleId: "AR-101"
    detectionHints:
      forbiddenDependencyPatterns:
        - "org.springframework.."
        - "jakarta.persistence.."
      indicativeAnnotations:
        - "@Component inside domain packages"
        - "@Entity inside domain packages"
        - "@RestController inside domain packages"
      recommendedTools:
        - "ArchUnit"
      notes:
        - "Domain code should not take on Spring component, web, or persistence stereotypes."
  - ruleId: "AR-104"
    detectionHints:
      concreteComponentPatterns:
        - "JpaRepository implementations or RestTemplate/WebClient clients referenced directly from application services"
      recommendedTools:
        - "ArchUnit"
      notes:
        - "Adapters should implement interfaces defined inward rather than leak repository or client implementations into business workflows."
