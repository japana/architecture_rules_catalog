ruleSetId: "data-management"
schemaVersion: "ruleset-catalog-v1"
ruleSetVersion: "0.2.0"
publisher: "APMDB Catalog Seed"
license: "Apache-2.0"
status: "published"
defaultLocale: "en"
availableLocales: ["en", "de"]
approvals:
  - maintainer: "japana"
    approvedAt: "2026-06-08T10:00:00Z"
    referenceType: "commit"
    reference: "https://github.com/japana/architecture_rules_catalog/commit/83d6caa63efb91a063c3410ab5a05ef53ef096fd"
rules:
  - id: "AR-501"
    status: "active"
    type: "persistence"
    abstractionLevel: "principle"
    strength: "must"
    decisionImpact: "warning"
    detectability: "ai-assisted"
    scope:
      - dimension: "artifactType"
        values: ["architecture-design", "source-code", "documentation"]
    appliesTo:
      artifactTypes: ["architecture-design", "source-code", "documentation"]
      architectureElements: ["domain", "application", "data-store", "service"]
    source:
      type: "architecture-principle"
      name: "Data Ownership"
      reference: "Business data should have clear ownership and responsibility."
    violationSignals: ["Multiple components change the same business data without clear ownership.", "No component is responsible for enforcing data meaning or lifecycle.", "Data ownership is inferred from storage location only."]
    relationships: []
  - id: "AR-502"
    status: "active"
    type: "persistence"
    abstractionLevel: "principle"
    strength: "must"
    decisionImpact: "warning"
    detectability: "ai-assisted"
    scope:
      - dimension: "artifactType"
        values: ["architecture-design", "source-code", "test-artifact"]
    appliesTo:
      artifactTypes: ["architecture-design", "source-code", "test-artifact"]
      architectureElements: ["domain", "application", "data-store"]
    source:
      type: "architecture-principle"
      name: "Invariant Protection"
      reference: "Data models should protect business invariants, not merely store fields."
    violationSignals: ["Invalid business states can be persisted without controlled validation.", "Important invariants exist only in UI logic or informal documentation.", "Persistence structures permit combinations that the business domain forbids."]
    relationships: []
  - id: "AR-503"
    status: "active"
    type: "persistence"
    abstractionLevel: "practice"
    strength: "must"
    decisionImpact: "blocking"
    detectability: "process"
    scope:
      - dimension: "artifactType"
        values: ["configuration", "build-pipeline", "runtime-operation", "documentation"]
    appliesTo:
      artifactTypes: ["configuration", "build-pipeline", "runtime-operation", "documentation"]
      architectureElements: ["data-store", "deployment", "service"]
    source:
      type: "engineering-practice"
      name: "Schema Change Safety"
      reference: "Persistent data changes should be migratable and operationally safe."
    violationSignals: ["Schema changes lack migration or rollback considerations.", "Existing data compatibility is not assessed.", "Deployment requires manual, undocumented data manipulation."]
    relationships: []
  - id: "AR-504"
    status: "active"
    type: "persistence"
    abstractionLevel: "principle"
    strength: "must"
    decisionImpact: "warning"
    detectability: "ai-assisted"
    scope:
      - dimension: "artifactType"
        values: ["architecture-design", "source-code", "runtime-operation"]
    appliesTo:
      artifactTypes: ["architecture-design", "source-code", "runtime-operation"]
      architectureElements: ["application", "service", "data-store", "external-system"]
    source:
      type: "architecture-principle"
      name: "Consistency Boundary"
      reference: "Write operations should define transactional and consistency boundaries deliberately."
    violationSignals: ["A business operation updates multiple data owners without consistency strategy.", "Partial failure can leave business state unclear.", "Transactional assumptions are hidden in infrastructure behavior."]
    relationships: []
  - id: "AR-505"
    status: "active"
    type: "persistence"
    abstractionLevel: "practice"
    strength: "must"
    decisionImpact: "warning"
    detectability: "ai-assisted"
    scope:
      - dimension: "artifactType"
        values: ["source-code", "architecture-design", "runtime-operation", "documentation"]
    appliesTo:
      artifactTypes: ["source-code", "architecture-design", "runtime-operation", "documentation"]
      architectureElements: ["data-store", "service", "application"]
    source:
      type: "architecture-principle"
      name: "Derived Data Integrity"
      reference: "Derived data should not be treated as truth without an update strategy."
    violationSignals: ["Cached, indexed, or projected data becomes authoritative without reconciliation.", "Stale derived data is indistinguishable from source data.", "Rebuild or refresh behavior is missing for derived stores."]
    relationships: []
  - id: "AR-506"
    status: "active"
    type: "persistence"
    abstractionLevel: "practice"
    strength: "should"
    decisionImpact: "warning"
    detectability: "ai-assisted"
    scope:
      - dimension: "artifactType"
        values: ["source-code", "architecture-design", "runtime-operation", "test-artifact"]
    appliesTo:
      artifactTypes: ["source-code", "architecture-design", "runtime-operation", "test-artifact"]
      architectureElements: ["data-store", "service"]
    source:
      type: "engineering-practice"
      name: "Access Path Awareness"
      reference: "Data access should consider expected volume and query paths."
    violationSignals: ["A query path grows with data volume without limits or indexes.", "N+1 or full-scan behavior is introduced in critical paths.", "Data access assumptions are untested for realistic volumes."]
    relationships: []
verificationTemplates:
  - templateId: "VT-AR-505-ARCHUNIT-001"
    ruleIds: ["AR-505"]
    type: "archunit"
    language: "java"
    framework: "archunit"
    coverage: "partial"
    determinism: "deterministic"
    templateRef: "templates/archunit/java/derived-data-integrity-rule.java.mustache"
    description: "ArchUnit template that ensures projection or index packages do not mutate source-of-truth repositories or aggregates directly."
    requiredParameters:
      - "basePackage"
      - "projectionPackages"
      - "sourceOfTruthPackages"
      - "mutatorClassNamePatterns"
    verifiesViolationSignals:
      - "Cached, indexed, or projected data becomes authoritative without reconciliation."
      - "Rebuild or refresh behavior is missing for derived stores."
    limitations:
      - "Detects structural mutation paths only."
      - "Cannot prove freshness, reconciliation correctness, or operational rebuild coverage."
    generates:
      description: "JUnit 5 ArchUnit test class for derived-data integrity boundaries."
      pathTemplate: "src/test/java/{{basePackagePath}}/architecture/DerivedDataIntegrityRuleTest.java"
    toolchain:
      - type: "archunit"
        version: ">=1.3.0"
      - type: "junit"
        version: ">=5.10.0"
  - templateId: "VT-AR-505-ARCHUNIT-QUARKUS-002"
    ruleIds: ["AR-505"]
    type: "archunit"
    language: "java"
    framework: "quarkus"
    coverage: "partial"
    determinism: "deterministic"
    templateRef: "templates/archunit/java/quarkus-derived-data-integrity-rule.java.mustache"
    description: "Quarkus-focused ArchUnit template that uses selected source-of-truth mutation paths as a structural proxy to keep projections and read models away from write-side mutation components."
    requiredParameters:
      - "basePackage"
      - "projectionPackagePatterns"
      - "sourceOfTruthMutatorPackagePatterns"
    verifiesViolationSignals:
      - "Cached, indexed, or projected data becomes authoritative without reconciliation."
      - "Rebuild or refresh behavior is missing for derived stores."
    limitations:
      - "Checks a structural proxy rule over selected mutation-path packages only."
      - "Read-only dependencies in the selected mutation-path packages can still trigger findings."
      - "Does not detect refresh strategies, rebuild orchestration, or derived-data authority mistakes outside those package boundaries."
      - "Does not prove event ordering, refresh cadence, or rebuild correctness."
    generates:
      description: "JUnit 5 ArchUnit test class for Quarkus derived-data integrity."
      pathTemplate: "src/test/java/{{basePackagePath}}/architecture/QuarkusDerivedDataIntegrityRuleTest.java"
    toolchain:
      - type: "archunit"
        version: ">=1.3.0"
      - type: "junit"
        version: ">=5.10.0"
  - templateId: "VT-AR-506-JUNIT-QUARKUS-002"
    ruleIds: ["AR-506"]
    type: "junit"
    language: "java"
    framework: "quarkus-test"
    coverage: "supporting"
    determinism: "deterministic"
    templateRef: "templates/junit/java/quarkus-access-path-awareness-test.java.mustache"
    description: "Quarkus integration-test template that exercises a representative read path and records result-size expectations plus a project-provided query-count signal for Panache-backed access."
    requiredParameters:
      - "basePackage"
      - "resourcePath"
      - "maxExpectedItems"
      - "responseCollectionSizePath"
      - "queryCountHeaderName"
      - "expectedQueryBudget"
      - "queryBudgetProbeDescription"
    verifiesViolationSignals:
      - "A query path grows with data volume without limits or indexes."
      - "N+1 or full-scan behavior is introduced in critical paths."
    limitations:
      - "Requires project-provided test-only instrumentation that exposes query counts through queryCountHeaderName."
      - "Fails fast with a clear message when the query-count signal is unavailable or malformed."
      - "Does not prove performance under production-scale data."
    generates:
      description: "Quarkus integration test skeleton for access-path awareness."
      pathTemplate: "src/test/java/{{basePackagePath}}/data/AccessPathAwarenessTest.java"
    toolchain:
      - type: "junit"
        version: ">=5.10.0"
      - type: "rest-assured"
        version: ">=5.4.0"
      - type: "quarkus-test"
        version: ">=3.0.0"
