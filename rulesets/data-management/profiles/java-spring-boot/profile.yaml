profileId: "java-spring-boot"
ruleSetId: "data-management"
schemaVersion: "ruleset-profile-v2"
status: "published"
displayName: "Java Spring Boot Verification Profile for Data Management"
description: "Spring Boot-specific verification profile for derived-data integrity checks."
appliesTo:
  languages: ["java"]
  frameworks: ["spring-boot"]
  architectureStyles: ["event-driven", "modular-monolith", "clean-architecture"]
  runtimes: ["jvm"]
toolchain:
  required:
    - type: "archunit"
      version: ">=1.3.0"
    - type: "junit"
      version: ">=5.10.0"
ruleMappings:
  - ruleId: "AR-505"
    verificationTemplates:
      - templateId: "VT-AR-505-ARCHUNIT-001"
        coverage: "partial"
        parameterBindings:
          basePackage: "{{project.basePackage}}"
          basePackagePath: "{{project.basePackagePath}}"
          projectionPackages: "{{project.packageRoles.projection}}"
          sourceOfTruthPackages: "{{project.packageRoles.sourceOfTruth}}"
          mutatorClassNamePatterns: "{{project.dataManagement.mutatorClassNamePatterns}}"
