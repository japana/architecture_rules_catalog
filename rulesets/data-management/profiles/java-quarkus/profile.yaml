profileId: "java-quarkus"
ruleSetId: "data-management"
schemaVersion: "ruleset-profile-v1"
status: "draft"
displayName: "Java Quarkus Profile for Data Management"
description: "Quarkus-specific detection hints for the data-management ruleset."
technology:
  language: "java"
  framework: "quarkus"
  runtime: "jvm"
mappings:
  - ruleId: "AR-501"
    detectionHints:
      concreteComponentPatterns: ["Multiple resources or services write the same table", "Persistence access shared across unrelated modules"]
      recommendedTools: ["ArchUnit", "module dependency review"]
  - ruleId: "AR-502"
    detectionHints:
      indicativeAnnotations: ["@Entity", "@Transactional"]
      concreteComponentPatterns: ["Invariant enforced only in resource", "Entity permits invalid state through public setters or fields"]
      recommendedTools: ["domain tests", "persistence tests"]
  - ruleId: "AR-503"
    detectionHints:
      concreteComponentPatterns: ["Schema generated implicitly in production", "Migration missing for entity change"]
      recommendedTools: ["Flyway", "Liquibase", "migration smoke tests"]
  - ruleId: "AR-504"
    detectionHints:
      indicativeAnnotations: ["@Transactional"]
      concreteComponentPatterns: ["External call inside transaction without failure strategy", "Transaction boundary unclear in application service"]
      recommendedTools: ["integration tests", "transaction review"]
  - ruleId: "AR-505"
    detectionHints:
      concreteComponentPatterns: ["Projection table or cache without refresh strategy", "Read model updated without reconciliation path"]
      recommendedTools: ["cache tests", "projection rebuild tests"]
  - ruleId: "AR-506"
    detectionHints:
      concreteComponentPatterns: ["Panache listAll in request path", "Lazy loading causes N+1 behavior"]
      recommendedTools: ["SQL logging", "performance smoke tests"]
