profileId: "java-quarkus"
ruleSetId: "data-management"
schemaVersion: "ruleset-profile-v2"
status: "published"
displayName: "Java Quarkus Verification Profile for Data Management"
description: "Quarkus-specific verification profile for derived-data integrity with Panache-aware mutation boundaries."
appliesTo:
  languages: ["java"]
  frameworks: ["quarkus"]
  architectureStyles: ["event-driven", "modular-monolith", "clean-architecture"]
  runtimes: ["jvm"]
toolchain:
  required:
    - type: "archunit"
      version: ">=1.3.0"
    - type: "junit"
      version: ">=5.10.0"
    - type: "rest-assured"
      version: ">=5.4.0"
    - type: "quarkus-test"
      version: ">=3.0.0"
ruleMappings:
  - ruleId: "AR-505"
    verificationTemplates:
      - templateId: "VT-AR-505-ARCHUNIT-QUARKUS-002"
        coverage: "partial"
        parameterBindings:
          basePackage: "{{project.basePackage}}"
          basePackagePath: "{{project.basePackagePath}}"
          projectionPackagePatterns: "{{project.packagePatterns.projectionCsv}}"
          sourceOfTruthMutatorPackagePatterns: "{{project.packagePatterns.sourceOfTruthMutatorCsv}}"
  - ruleId: "AR-506"
    verificationTemplates:
      - templateId: "VT-AR-506-JUNIT-QUARKUS-002"
        coverage: "supporting"
        parameterBindings:
          basePackage: "{{project.basePackage}}"
          basePackagePath: "{{project.basePackagePath}}"
          resourcePath: "{{project.dataManagement.readPath.resourcePath}}"
          maxExpectedItems: "{{project.dataManagement.readPath.maxExpectedItems}}"
          responseCollectionSizePath: "{{project.dataManagement.readPath.responseCollectionSizePath}}"
          queryCountHeaderName: "{{project.dataManagement.readPath.queryCountHeaderName}}"
          expectedQueryBudget: "{{project.dataManagement.readPath.expectedQueryBudget}}"
          queryBudgetProbeDescription: "{{project.dataManagement.readPath.queryBudgetProbeDescription}}"
