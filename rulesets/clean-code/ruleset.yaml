defaultLocale: "en"
availableLocales:
  - "en"
  - "de"
approvals:
  - maintainer: "japana"
    approvedAt: "2026-06-06T10:00:00Z"
    referenceType: "commit"
    reference: "https://github.com/japana/architecture_rules_catalog/commit/2d941e2045be814ea7961d4fc3f07e89cbdadbe9"
rules:
  - id: "AR-201"
    status: "active"
    type: "naming"
    abstractionLevel: "practice"
    strength: "should"
    decisionImpact: "advisory"
    detectability: "ai-assisted"
    scope:
      - dimension: "artifactType"
        values: ["source-code", "documentation", "test-artifact"]
    appliesTo:
      artifactTypes: ["source-code", "documentation", "test-artifact"]
      architectureElements: ["module", "service", "application", "domain", "interface"]
    source:
      type: "engineering-practice"
      name: "Clean Code"
      reference: "Meaningful naming"
    violationSignals:
      - "Identifiers hide purpose, responsibility, or business meaning."
      - "Abbreviations are understandable only to a small subset of contributors."
      - "Names emphasize implementation mechanics although business intent would be more useful."
    relationships: []
  - id: "AR-202"
    status: "active"
    type: "governance"
    abstractionLevel: "practice"
    strength: "should"
    decisionImpact: "warning"
    detectability: "ai-assisted"
    scope:
      - dimension: "artifactType"
        values: ["source-code", "test-artifact"]
    appliesTo:
      artifactTypes: ["source-code", "test-artifact"]
      architectureElements: ["service", "application", "module", "interface"]
    source:
      type: "engineering-practice"
      name: "Clean Code"
      reference: "Focused responsibilities"
    violationSignals:
      - "A function mixes several business responsibilities."
      - "A function combines validation, decision-making, persistence, mapping, and side effects without clear separation."
      - "The purpose of a function is only understandable after reading many low-level details."
    relationships:
      - target: "AR-206"
        type: "supports"
        rationale: "Focused responsibilities make behavior easier to test."
  - id: "AR-203"
    status: "active"
    type: "module-boundary"
    abstractionLevel: "practice"
    strength: "must"
    decisionImpact: "warning"
    detectability: "ai-assisted"
    scope:
      - dimension: "artifactType"
        values: ["source-code", "module-structure", "architecture-design"]
    appliesTo:
      artifactTypes: ["source-code", "module-structure", "architecture-design"]
      architectureElements: ["module", "service", "interface"]
    source:
      type: "engineering-practice"
      name: "Information Hiding"
      reference: "Stable, narrow interfaces protect internals."
    violationSignals:
      - "Callers must understand internal data structures or internal workflows to use a module."
      - "Internal helpers become part of public usage."
      - "Changes to internal details unnecessarily break external consumers."
    relationships: []
  - id: "AR-204"
    status: "active"
    type: "api"
    abstractionLevel: "practice"
    strength: "must"
    decisionImpact: "warning"
    detectability: "ai-assisted"
    scope:
      - dimension: "artifactType"
        values: ["source-code", "api-contract", "runtime-operation", "test-artifact"]
    appliesTo:
      artifactTypes: ["source-code", "api-contract", "runtime-operation", "test-artifact"]
      architectureElements: ["service", "application", "interface", "module"]
    source:
      type: "engineering-practice"
      name: "Explicit Error Handling"
      reference: "Failure behavior should be intentional and understandable."
    violationSignals:
      - "Errors are silently swallowed."
      - "Fallbacks change behavior without being visible or understandable."
      - "Null, empty, or default values hide business-relevant failures."
    relationships: []
  - id: "AR-205"
    status: "active"
    type: "build"
    abstractionLevel: "practice"
    strength: "should"
    decisionImpact: "advisory"
    detectability: "ai-assisted"
    scope:
      - dimension: "artifactType"
        values: ["source-code", "module-structure", "test-artifact"]
    appliesTo:
      artifactTypes: ["source-code", "module-structure", "test-artifact"]
      architectureElements: ["module", "service", "application", "domain"]
    source:
      type: "engineering-practice"
      name: "DRY With Stable Meaning"
      reference: "Avoid premature abstraction."
    violationSignals:
      - "Similar logic is merged too early although it exists for different business reasons."
      - "A shared abstraction keeps growing special cases to serve unrelated scenarios."
      - "Truly identical business rules are maintained separately in multiple places."
    relationships:
      - target: "AR-202"
        type: "relatedTo"
        rationale: "Premature abstraction often hides the real responsibility of a function or module."
  - id: "AR-206"
    status: "active"
    type: "testing"
    abstractionLevel: "practice"
    strength: "must"
    decisionImpact: "warning"
    detectability: "ai-assisted"
    scope:
      - dimension: "artifactType"
        values: ["source-code", "test-artifact", "architecture-design"]
    appliesTo:
      artifactTypes: ["source-code", "test-artifact", "architecture-design"]
      architectureElements: ["domain", "application", "service", "module", "interface"]
    source:
      type: "engineering-practice"
      name: "Testability"
      reference: "Behavior should be controllable and automatable."
    violationSignals:
      - "Business behavior is testable only through hard-to-control infrastructure."
      - "Strong coupling, global state, or uncontrolled side effects make tests difficult."
      - "Tests must prepare many irrelevant details to verify one business rule."
    relationships: []
