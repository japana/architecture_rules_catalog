profileId: "java-spring-boot"
ruleSetId: "security-baseline"
schemaVersion: "ruleset-profile-v2"
status: "published"
displayName: "Java Spring Boot Verification Profile for Security Baseline"
description: "Spring Boot-specific verification profile for secret scanning and authn/authz separation."
appliesTo:
  languages: ["java"]
  frameworks: ["spring-boot"]
  architectureStyles: ["layered", "modular-monolith", "distributed-system"]
  runtimes: ["jvm"]
toolchain:
  required:
    - type: "gitleaks"
      version: ">=8.18.0"
    - type: "archunit"
      version: ">=1.3.0"
    - type: "junit"
      version: ">=5.10.0"
ruleMappings:
  - ruleId: "AR-301"
    verificationTemplates:
      - templateId: "VT-AR-301-GITLEAKS-001"
        coverage: "partial"
        parameterBindings:
          configTitle: "{{project.id}}-secret-protection"
          additionalSecretPatterns: "{{project.security.additionalSecretPatterns}}"
          allowedTestSecretPatterns: "{{project.security.allowedTestSecretPatterns}}"
  - ruleId: "AR-302"
    verificationTemplates:
      - templateId: "VT-AR-302-ARCHUNIT-001"
        coverage: "heuristic"
        parameterBindings:
          basePackage: "{{project.basePackage}}"
          basePackagePath: "{{project.basePackagePath}}"
          authenticationPackages: "{{project.packageRoles.authentication}}"
          authorizationPackages: "{{project.packageRoles.authorization}}"
          businessServicePackages: "{{project.packageRoles.application}}"
