ruleSetId: "security-baseline"
locale: "de"
name: "Security Baseline"
description: "Regelwerk für sichere Defaults, Zugriffskontrolle, Secret-Schutz und auditierbare Sicherheitsereignisse mit konkreter Review-Hilfe."
category: "Sicherheit"
compatibility: "Sprachunabhängig"
tags:
  - "Sicherheit"
  - "Baseline"
  - "Härtung"
rules:
  - id: "AR-301"
    title: "Secrets gehören nie in Quellcode-Repositories"
    content: "Passwörter, API-Keys, Token, Private Keys und vergleichbare Secrets dürfen nicht im Quellcode, in Beispieldateien, Logs oder Build-Artefakten abgelegt werden."
    tags:
      - "Secrets"
      - "CredentialManagement"
    keywords:
      - "api-key"
      - "passwort"
      - "token"
    aiGuidance:
      reviewQuestions:
        - "Kann ein Zugangswert oder Secret versehentlich committet, geloggt oder mit Artefakten ausgeliefert werden?"
        - "Sind Platzhalter, Beispiele und lokale Umgebungsdateien klar von echten Secrets getrennt?"
      positiveExamples:
        - "Eine Anwendung lädt Secrets aus einem Secret Store und maskiert sie in Logs."
      negativeExamples:
        - "Eine .env.example-Datei enthält einen echten API-Key oder ein Debug-Log druckt ein Bearer-Token aus."
      remediation: "Verschiebe Secrets in Secret-Manager oder lokal ignorierte Konfiguration, ersetze committete Werte durch Platzhalter und maskiere Logausgaben."
  - id: "AR-302"
    title: "Authentifizierung und Autorisierung sind getrennt"
    content: "Identitätsprüfung und Rechteentscheidung sollen als getrennte Verantwortungen modelliert werden, damit Fachrechte nicht implizit aus Login-Zuständen abgeleitet werden."
    tags:
      - "Authentifizierung"
      - "Autorisierung"
    keywords:
      - "authn"
      - "authz"
      - "least-privilege"
    aiGuidance:
      reviewQuestions:
        - "Sind Identitätsprüfung und Berechtigungsentscheidung in Code und Design getrennt?"
        - "Kann eine gültige Session versehentlich Fachrechte verleihen, ohne dass eine explizite Policy geprüft wird?"
      positiveExamples:
        - "Ein Service prüft Identität über eine Komponente und Berechtigungen über einen Policy-Service."
      negativeExamples:
        - "Ein Controller behandelt jeden authentifizierten Benutzer automatisch als für Admin-Aktionen berechtigt."
      remediation: "Führe eine explizite Autorisierungsschicht oder Policy-Prüfung ein, statt Rechte aus Authentifizierungszustand abzuleiten."
  - id: "AR-303"
    title: "Externe Eingaben werden an Systemgrenzen validiert"
    content: "Externe Eingaben aus HTTP, Messaging, CLI, Dateien oder Integrationen sollen an der Grenze validiert, normalisiert und bei Verstößen kontrolliert abgewiesen werden."
    tags:
      - "Validierung"
      - "Grenze"
    keywords:
      - "input-validation"
      - "verträge"
    aiGuidance:
      reviewQuestions:
        - "Wird jede unvertrauenswürdige Eingabe validiert, bevor sie Fachlogik erreicht?"
        - "Werden ungültige Nutzdaten kontrolliert und beobachtbar zurückgewiesen?"
      positiveExamples:
        - "Ein Request-DTO wird per Schema validiert und normalisiert, bevor der Use Case aufgerufen wird."
      negativeExamples:
        - "Rohe Request-Felder fließen direkt in SQL-Aufbau oder Dateisystempfade."
      remediation: "Ergänze Boundary-Validierung, Normalisierung und explizite Ablehnungspfade vor der Fachverarbeitung."
  - id: "AR-304"
    title: "Least Privilege gilt für Benutzer und Dienste"
    content: "Benutzer, technische Identitäten und Hintergrundprozesse sollen nur die minimal erforderlichen Rechte erhalten und möglichst eng begrenzt werden."
    tags:
      - "Berechtigungen"
      - "ServiceAccounts"
    keywords:
      - "minimale-rechte"
      - "zugriffsumfang"
    aiGuidance:
      reviewQuestions:
        - "Haben Accounts und Dienste nur die Rechte, die sie für ihre aktuelle Verantwortung wirklich brauchen?"
        - "Werden breite Wildcard-Rechte oder langlebige erhöhte Rollen vermieden?"
      positiveExamples:
        - "Ein Batch-Job nutzt einen dedizierten Service-Account, der auf einen Storage-Bucket begrenzt ist."
      negativeExamples:
        - "Ein gemeinsamer Admin-Zugang wird von allen Automatisierungsjobs verwendet."
      remediation: "Schneide Identitäten nach Verantwortung und reduziere Berechtigungen auf den kleinstmöglichen sinnvollen Umfang."
  - id: "AR-305"
    title: "Sicherheitsrelevante Ereignisse sind auditierbar"
    content: "Anmeldeereignisse, Rechteänderungen, Secret-Rotation und sicherheitsrelevante Konfigurationswechsel sollen nachvollziehbar protokolliert werden."
    tags:
      - "Audit"
      - "Nachvollziehbarkeit"
    keywords:
      - "audit-log"
      - "traceability"
    aiGuidance:
      reviewQuestions:
        - "Lassen sich wichtige Sicherheitsaktionen nachträglich aus Logs oder Audit-Trails rekonstruieren?"
        - "Erfassen Logs Akteur, Aktion und Ergebnis, ohne sensible Daten preiszugeben?"
      positiveExamples:
        - "Eine Admin-Berechtigungsänderung schreibt einen Audit-Eintrag mit Akteur, Ziel und Zeitstempel."
      negativeExamples:
        - "Eine Credential-Rotation läuft still durch und hinterlässt kein nachvollziehbares Ereignis."
      remediation: "Füge strukturierte Audit-Ereignisse für sicherheitskritische Aktionen hinzu und maskiere sensible Werte konsequent."
  - id: "AR-306"
    title: "Sichere Defaults gehen vor Bequemlichkeit"
    content: "Unsichere Sonderpfade wie Test-Bypasses, offene Debug-Schnittstellen oder globale Vollzugriffe müssen standardmäßig deaktiviert sein."
    tags:
      - "Defaults"
      - "Härtung"
    keywords:
      - "sichere-defaults"
      - "opt-in-risiko"
    aiGuidance:
      reviewQuestions:
        - "Startet ein frisches Deployment ohne Zusatzarbeit im sichersten vernünftigen Modus?"
        - "Sind riskante Fähigkeiten hinter explizitem Opt-in statt implizit aktiv?"
      positiveExamples:
        - "Ein Debug-Endpunkt ist deaktiviert, solange kein lokaler Entwicklungs-Flag gesetzt wird."
      negativeExamples:
        - "Ein Produktions-Build liefert einen Test-Bypass oder einen uneingeschränkten Admin-Modus aktiviert aus."
      remediation: "Drehe riskante Defaults auf aus, verlange explizites Opt-in und dokumentiere den freigegebenen Escape Hatch."
