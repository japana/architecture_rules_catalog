profileId: "generic"
ruleSetId: "delivery-and-runtime-architecture"
schemaVersion: "ruleset-profile-v2"
status: "review"
displayName: "Generic Profile for Runtime Readiness"
description: "Generic runtime readiness review profile for configuration, readiness, and runtime switches."
appliesTo:
  languages: ["generic"]
  architectureStyles: ["any"]
toolchain:
  required:
    - type: "manual-review"
      version: ">=1.0.0"
ruleMappings:
  - ruleId: "AR-931"
    verificationTemplates:
      - templateId: "VT-AR-932-CHECKLIST-001"
        coverage: "supporting"
        parameterBindings:
          serviceName: "{{service.name}}"
          reviewer: "{{review.reviewer}}"
          reviewedAt: "{{review.date}}"
          runtimeEnvironmentsList:
            type: "stringList"
            source: "{{service.runtime.environmentsList}}"
            minItems: 1
          criticalConfigurationItemsList:
            type: "stringList"
            source: "{{service.runtime.criticalConfigurationItemsList}}"
            minItems: 1
          readinessSignalsList:
            type: "stringList"
            source: "{{service.runtime.readinessSignalsList}}"
            minItems: 1
          runtimeSwitchesList:
            type: "stringList"
            source: "{{service.runtime.switchesList}}"
            minItems: 1
