profileId: "java-spring-boot"
ruleSetId: "api-design"
schemaVersion: "ruleset-profile-v1"
status: "published"
displayName: "Java Spring Boot Profile for API Design"
description: "Spring Boot-specific detection hints for the api-design ruleset."
technology:
  language: "java"
  framework: "spring-boot"
  runtime: "jvm"
mappings:
  - ruleId: "AR-401"
    detectionHints:
      indicativeAnnotations: ["@RestController", "@RequestMapping", "@GetMapping", "@PostMapping"]
      recommendedTools: ["OpenAPI contract validation", "Spring MVC tests"]
      notes: ["Check whether controller behavior is represented by an explicit API contract."]
  - ruleId: "AR-402"
    detectionHints:
      indicativeAnnotations: ["@ControllerAdvice", "@ExceptionHandler", "@ResponseStatus"]
      recommendedTools: ["Spring MVC tests", "API error contract tests"]
      notes: ["Verify that exception mappings produce consistent external error structures."]
  - ruleId: "AR-403"
    detectionHints:
      indicativeAnnotations: ["@Entity", "@Table", "@RestController"]
      concreteComponentPatterns: ["JPA entity returned directly from controller", "Persistence entity used as request or response model"]
      recommendedTools: ["ArchUnit", "API review"]
  - ruleId: "AR-404"
    detectionHints:
      recommendedTools: ["OpenAPI diff", "contract tests"]
      notes: ["Compare generated or maintained OpenAPI descriptions for breaking changes."]
  - ruleId: "AR-405"
    detectionHints:
      concreteComponentPatterns: ["POST command endpoint without duplicate handling", "Retryable client command without idempotency key"]
      recommendedTools: ["Integration tests", "contract tests"]
  - ruleId: "AR-406"
    detectionHints:
      concreteComponentPatterns: ["Repository findAll exposed through endpoint", "List response without Pageable or explicit limit"]
      recommendedTools: ["Spring MVC tests", "performance smoke tests"]
