profileId: "java-spring-boot"
ruleSetId: "api-design"
schemaVersion: "ruleset-profile-v2"
status: "published"
displayName: "Java Spring Boot Verification Profile for API Design"
description: "Spring Boot-specific verification profile for API-focused architecture rules."
appliesTo:
  languages: ["java"]
  frameworks: ["spring-boot"]
  architectureStyles: ["layered", "modular-monolith", "distributed-system"]
  runtimes: ["jvm"]
toolchain:
  required:
    - type: "archunit"
      version: ">=1.3.0"
    - type: "junit"
      version: ">=5.10.0"
    - type: "spectral"
      version: ">=6.11.0"
ruleMappings:
  - ruleId: "AR-403"
    verificationTemplates:
      - templateId: "VT-AR-403-ARCHUNIT-001"
        coverage: "partial"
        parameterBindings:
          basePackage: "{{project.basePackage}}"
          basePackagePath: "{{project.basePackagePath}}"
          apiPackages: "{{project.packageRoles.api}}"
          dtoPackages: "{{project.packageRoles.dto}}"
          persistencePackages: "{{project.packageRoles.persistence}}"
  - ruleId: "AR-406"
    verificationTemplates:
      - templateId: "VT-AR-406-SPECTRAL-001"
        coverage: "heuristic"
        parameterBindings:
          ruleNamePrefix: "{{project.id}}"
          defaultPageSizeParameterNames: "{{project.api.pagination.pageSizeParameters}}"
          defaultCursorParameterNames: "{{project.api.pagination.cursorParameters}}"
